# 비밀 키 유출 검사 (2026-10-13 보안 점검 B)
# PR과 main 푸시 때마다 gitleaks로 코드에 API 키·비밀번호 같은 값이 섞여 들어갔는지 검사합니다.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
